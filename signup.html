<!DOCTYPE html>
<html>
<head>
    <title>Sign Up Page</title>
</head>
<body>

    <!-- Main heading -->
    <h1>Create an Account</h1>
    <p>Fill in the form below to register.</p>

    <!-- The registration form -->
    <form action="login.html" method="get">

        <!-- Full Name (required, with placeholder) -->
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
        <br><br>

        <!-- Email (required, with placeholder) -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
        <br><br>

        <!-- Phone Number -->
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="01XXXXXXXXX">
        <br><br>

        <!-- Password (hidden, required) -->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Create a password" required>
        <br><br>

        <!-- Confirm Password (hidden, required) -->
        <label for="confirm">Confirm Password:</label>
        <input type="password" id="confirm" name="confirm" placeholder="Type password again" required>
        <br><br>

        <!-- Agree to terms (must be ticked) -->
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the terms and conditions</label>
        <br><br>

        <!-- Buttons -->
        <input type="submit" value="Register">
        <input type="reset" value="Reset">

    </form>

    <br>

    <!-- Link back to the login page -->
    Already have an account? <a href="login.html">Login here</a>

</body>
</html>
